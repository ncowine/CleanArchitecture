# Builds the CleanArch.Api Docker image and pushes it to GitHub Container Registry (GHCR), so it can
# be PULLED onto any machine (e.g. an Ubuntu box) without the source code. The Docker deployment in
# observability/docker/ consumes the published image. See observability/docker/README.md.

name: Publish API image

on:
  push:
    branches: [main]
    tags: ['v*']            # a git tag like v1.2.0 also tags the image v1.2.0
  workflow_dispatch: {}     # lets you trigger a build by hand from the Actions tab

env:
  # GHCR image name. Owner must be lowercase (ncowine already is). github.repository_owner keeps
  # this correct across forks.
  IMAGE: ghcr.io/${{ github.repository_owner }}/cleanarch-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically to the workflow

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .            # repo root — matches the Dockerfile's expectations
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
