# =============================================================================
#  Loki — the LOGS store (Docker variant of ../loki/loki-config.yaml)
# =============================================================================
# Loki stores the app's log lines. The app PUSHES logs here over OTLP/HTTP to
# http://loki:3100/otlp/v1/logs; Grafana READS them from the same :3100 API.
#
# Only difference from the native-Windows config: the storage paths live under the
# container volume (/loki) instead of ./loki-data. Otherwise it's the standard
# single-node, local-filesystem dev setup.
#
# Mounted into the container by docker-compose.yml and passed via
# `-config.file=/etc/loki/loki-config.yaml`.

auth_enabled: false                       # no multi-tenant auth in dev — anyone on the network can read/write

server:
  http_listen_port: 3100                  # the one HTTP port: Grafana reads here AND the app posts logs here
  grpc_listen_port: 9096                  # internal gRPC (single node still needs it); not published to the host

common:
  instance_addr: 127.0.0.1                # this single node's address (talks only to itself)
  path_prefix: /loki                      # base folder for everything below — on the loki-data volume
  storage:
    filesystem:                           # store on local disk (no object store in dev)
      chunks_directory: /loki/chunks      # the actual compressed log data
      rules_directory: /loki/rules        # alerting/recording rules (unused here)
  replication_factor: 1                   # keep one copy — there's only one node
  ring:
    kvstore:
      store: inmemory                     # the cluster "ring" is kept in memory (fine for a single node)

# Loki needs to know how its index is laid out. This is the current recommended
# scheme (TSDB, schema v13); the date is just "in effect from" and can stay as-is.
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb                         # the index type
      object_store: filesystem            # matches the filesystem storage above
      schema: v13
      index:
        prefix: index_                    # index files are named index_*
        period: 24h                       # roll the index daily

limits_config:
  allow_structured_metadata: true         # REQUIRED for OTLP logs — lets attributes (like trace_id) attach to lines
  volume_enabled: true                    # enables the "log volume" bar in Grafana's Explore view

analytics:
  reporting_enabled: false                # don't phone home
