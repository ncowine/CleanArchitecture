# Loki — logs store. Docker variant of ../loki/loki-config.yaml.
# Only difference from the Windows config: path_prefix + storage dirs live under the container
# volume (/loki). The app pushes OTLP/HTTP to http://<host>:3100/otlp/v1/logs; Grafana reads on :3100.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
