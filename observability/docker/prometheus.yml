# Prometheus — metrics store. Docker variant of ../prometheus/prometheus.yml.
# Difference from the Windows config: the cleanarch-api scrape target.
#
#   Default (API in this compose):   api:5235          <-- Prometheus reaches the `api` container
#                                                          by its service name on the shared network.
#   Alternative (API on the host):   host.docker.internal:5235   <-- comment the api line, uncomment
#                                    this one; the extra_hosts mapping in docker-compose.yml makes
#                                    host.docker.internal resolve on native Linux too.
#
# Reload after edits (compose runs with --web.enable-lifecycle):
#   curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Negotiate classic underscore metric names (http_server_request_duration_seconds) that the
  # dashboard expects, instead of Prometheus 3.x UTF-8 dotted names.
  metric_name_escaping_scheme: underscores

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The API's OpenTelemetry /metrics page (pull model). See header for the target choice.
  - job_name: cleanarch-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:5235']
      # - targets: ['host.docker.internal:5235']   # use this instead if the API runs on the host
