# =============================================================================
#  Elasticsearch + Kibana ADD-ON for docker-compose.prod.yml (audit trail)
# =============================================================================
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.elk.yml up -d
#
# Unlike the base production file this one IS an overlay, and safely so: it only
# ADDS things (two services, one Caddy hostname, one Caddy site file). Nothing
# here needs to REMOVE a port, which is the merge behaviour that made an overlay
# the wrong tool for the base stack.
#
# ── Why this add-on gets stricter treatment than the rest ────────────────────
# Elasticsearch holds the AUDIT TRAIL — the record of who changed what. An audit
# log an attacker can edit or delete is worse than no audit log, because it is
# trusted. The dev version of this file runs with xpack.security.enabled=false,
# which means anyone who can reach port 9200 can read every audit record, forge
# new ones, or DELETE the index. That is the single most dangerous line in the
# dev stack and it is inverted here.
#
# ── First-run bootstrap is NOT optional ──────────────────────────────────────
# Turning security on leaves two accounts unusable until you set them up:
# kibana_system (Kibana's own service account) and the least-privilege API key
# the app writes with. Run scripts/bootstrap-elk.sh once after the first start —
# README-production.md walks through it.
#
# ⚠️  UBUNTU HOST SETTING REQUIRED (same as dev): Elasticsearch will not start
#     until the kernel allows enough memory maps.
#         echo 'vm.max_map_count=262144' | sudo tee /etc/sysctl.d/99-es.conf
#         sudo sysctl --system
# =============================================================================

services:

  # ── Give Kibana a public hostname, only when this add-on is running ────────
  caddy:
    environment:
      KIBANA_HOST: "${KIBANA_HOST:?set KIBANA_HOST in .env}"
    volumes:
      # Dropped into the folder the base Caddyfile imports with a glob. Volume
      # lists append when Compose merges, so this is added to the base mounts.
      - ./caddy/kibana.caddyfile:/etc/caddy/conf.d/kibana.caddyfile:ro

  # NOTE: there is no "api" service to override here. The app runs on IIS on the
  # Windows server, so its audit settings are configured THERE, not in this file:
  #
  #   Audit__Elasticsearch__Uri     https://audit.<your-domain>   (via Caddy, TLS)
  #   Audit__Elasticsearch__ApiKey  the key from scripts/bootstrap-elk.sh
  #
  # See README-windows-iis.md. The key must reach Elasticsearch over HTTPS —
  # without the Caddy site in front, it would cross the internet in cleartext on
  # every audit write.

  # ── Elasticsearch: the audit store ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    environment:
      discovery.type: "single-node"

      # THE line that differs from dev. With security on, every request needs a
      # credential, so an unauthenticated caller cannot read, write or delete.
      xpack.security.enabled: "true"

      # Bootstraps the built-in "elastic" superuser password. This is read ONLY
      # on the first start of an empty data volume; changing it later does
      # nothing (use bin/elasticsearch-reset-password instead).
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}"

      # HTTP TLS is off for the CONTAINER-TO-CONTAINER hop only, and that needs
      # justifying carefully in this deployment, because the app writing audit
      # records is on a different host across the internet.
      #
      # The hop that crosses the internet is app -> Caddy, and it IS encrypted:
      # Caddy serves https://audit.<domain> with a real certificate. What is
      # unencrypted is only the last leg, Caddy -> elasticsearch, which never
      # leaves this VM's virtual bridge. An attacker able to observe that leg
      # already has root on this box, at which point TLS between two local
      # containers protects nothing.
      #
      # So the rule is: the audit API key must never leave a machine in the
      # clear. Caddy is what guarantees that. If you ever bypass Caddy and point
      # the app straight at port 9200, this line becomes a serious mistake.
      xpack.security.http.ssl.enabled: "false"

      # Heap. The rule is: half of what you give the container, and never more
      # than ~31GB. Xms and Xmx must be equal so the JVM does not resize under
      # load. 1GB heap inside a 2GB limit suits a small audit workload; raise
      # both together if you index a lot.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - backend        # internal only: not reachable from outside the host
    healthcheck:
      # Authenticated now that security is on — an anonymous probe would 401 and
      # the container would never be reported healthy.
      test: ["CMD-SHELL", "curl -sf -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    mem_limit: 2g
    restart: unless-stopped

  # ── Kibana: the UI for searching the audit trail ───────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"

      # Kibana authenticates to Elasticsearch as the built-in kibana_system
      # account, which can manage Kibana's own indices and nothing else. It has
      # no usable password until scripts/bootstrap-elk.sh sets one.
      # Never point this at the elastic superuser.
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "${KIBANA_SYSTEM_PASSWORD:?run scripts/bootstrap-elk.sh, then set KIBANA_SYSTEM_PASSWORD in .env}"

      # Kibana encrypts saved objects, alerting state and session data with these.
      # If they are not set, Kibana generates random ones AT EVERY START, which
      # silently invalidates saved objects and breaks alerting after any restart.
      # Must be 32+ characters and must stay stable for the life of the deployment.
      XPACK_SECURITY_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env (32+ chars)}"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"
      XPACK_REPORTING_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"

      # Kibana sits behind Caddy, so it must know its own public address to build
      # correct links and to accept the proxied requests.
      SERVER_PUBLICBASEURL: "https://${KIBANA_HOST}"
    networks:
      # backend ONLY. Caddy is on this network too, so it can forward to Kibana
      # without Kibana having any route to the internet.
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    mem_limit: 1g
    restart: unless-stopped

volumes:
  es-data:
