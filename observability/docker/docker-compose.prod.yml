# =============================================================================
#  Observability stack — PRODUCTION, Ubuntu VM
# =============================================================================
#   docker compose -f docker-compose.prod.yml up -d
#
# ── What runs where ──────────────────────────────────────────────────────────
# The application is NOT in this file. It runs on IIS on a separate Windows
# Server, reached over the public internet. This VM holds only the telemetry
# stores and the dashboards:
#
#   Windows Server (IIS)                      Ubuntu VM (this file)
#   ─────────────────────                     ─────────────────────
#   CleanArch.Api  ──── traces  ─────────────▶ caddy ─▶ tempo
#                  ──── logs    ─────────────▶ caddy ─▶ loki
#                  ──── audit   ─────────────▶ caddy ─▶ elasticsearch
#                  ◀─── metrics scrape ─────── prometheus dials OUT to IIS
#
#   your browser   ──── dashboards ──────────▶ caddy ─▶ grafana / kibana
#
# Configuring the Windows side is a separate job with its own hazards — see
# README-windows-iis.md. Read README-production.md first for the whole picture.
#
# This is a STANDALONE file, not an overlay on docker-compose.yml. Compose
# merges override files by APPENDING list entries, so a "ports:" mapping in a
# base file cannot be removed by an override — the most safety-critical property
# of this stack would then depend on a merge rule. Here you can answer "what
# faces the internet?" by searching this one file for "ports:" and finding a
# single occurrence, on caddy.
#
# ── The consequence of splitting the two hosts ───────────────────────────────
# In a single-host deployment the app talks to Tempo, Loki and Elasticsearch
# over a private Docker bridge, and none of that traffic is reachable or worth
# encrypting. Splitting the hosts across the internet changes that completely:
# every one of those flows now crosses the public network, and Tempo and Loki
# have no authentication of their own to fall back on. That is why all ingest
# goes through Caddy (TLS + credentials + an IP allowlist) rather than by
# publishing 4317/3100/9200, which would leave them open to the world.
# =============================================================================

name: cleanarch-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

services:

  # ── The reverse proxy: the only internet-facing container ──────────────────
  caddy:
    image: caddy:2.9-alpine
    <<: [*logging, *hardening]
    # THE ONLY "ports:" IN THIS FILE.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}"

      # Ingest hostnames — publicly resolvable, because the Windows box connects
      # to them from the internet.
      INGEST_HOST: "${INGEST_HOST:?set INGEST_HOST in .env}"
      AUDIT_HOST: "${AUDIT_HOST:?set AUDIT_HOST in .env}"

      # Dashboard hostname — publicly resolvable so it can hold a real
      # certificate, but served only to UI_ALLOWED_IPS.
      GRAFANA_HOST: "${GRAFANA_HOST:?set GRAFANA_HOST in .env}"

      # Source-address allowlists. Space-separated IPs or CIDRs.
      APP_SERVER_IPS: "${APP_SERVER_IPS:?set APP_SERVER_IPS in .env}"
      UI_ALLOWED_IPS: "${UI_ALLOWED_IPS:?set UI_ALLOWED_IPS in .env}"

      # Credentials the app presents when pushing traces and logs.
      INGEST_USER: "${INGEST_USER:?set INGEST_USER in .env}"
      INGEST_PASSWORD_HASH: "${INGEST_PASSWORD_HASH:?set INGEST_PASSWORD_HASH in .env}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      # Certificates and the ACME account key. Losing this volume means
      # re-issuing everything, and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge      # public ports, and outbound access for ACME
      - backend   # so it can forward to tempo/loki/elasticsearch/grafana/kibana
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    restart: unless-stopped

  # ── Telemetry stores ───────────────────────────────────────────────────────
  # No published ports and no authentication of their own. Their protection is
  # that they sit on an internal-only network, and the only route to them from
  # outside is through Caddy, which authenticates first.

  tempo:
    image: grafana/tempo:2.7.1
    <<: [*logging, *hardening]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.prod.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    mem_limit: 1g
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    <<: [*logging, *hardening]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.prod.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    mem_limit: 1g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    <<: [*logging, *hardening]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Two retention limits; whichever is hit first wins. The SIZE limit is the
      # one that actually protects the disk, because time-based retention says
      # nothing about how much data arrives per day.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}"
      # NOTE: --web.enable-lifecycle is deliberately ABSENT (the dev stack has
      # it). It exposes an unauthenticated POST /-/reload. Restart instead.
    volumes:
      # A DIFFERENT config from the dev stack: it scrapes the Windows server
      # over the internet rather than a container on this host.
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      # Prometheus is the one store that needs OUTBOUND internet, because it
      # PULLS metrics and the target is on another machine. This is the practical
      # cost of the pull model in a split deployment: the scraper cannot live on
      # the isolated network. It still publishes no ports of its own.
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q Ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    mem_limit: 1g
    restart: unless-stopped

  # ── The dashboard UI ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.1
    <<: [*logging, *hardening]
    environment:
      # The dev stack ran this anonymous-with-Admin-rights. These lines undo it.
      # Caddy's IP allowlist is a perimeter; this is what protects you from
      # anyone already inside it. Do not disable it because "only we can reach it".
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_HOST}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Reused unchanged from the dev stack: the datasource URLs are service
      # names on the backend network, which is still correct — Grafana queries
      # the stores locally, so only INGEST crosses the internet, never queries.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboard-cleanarch-api.json:/var/lib/grafana/dashboards/cleanarch-api.json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - backend
    depends_on:
      - prometheus
      - tempo
      - loki
    cap_drop:
      - ALL
    mem_limit: 512m
    restart: unless-stopped

networks:
  # Has a gateway: public ports and outbound internet.
  edge:
    driver: bridge
  # "internal: true" removes the gateway, so containers attached ONLY to this
  # network cannot reach the internet at all and nothing outside can address
  # them. Tempo, Loki, Grafana (and Elasticsearch/Kibana in the ELK add-on) live
  # here exclusively.
  backend:
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
