# Build-from-source OVERRIDE for docker-compose.yml.
#
# The base file PULLS the API image from GHCR (no source needed). Use THIS override only when you
# have the full repo checked out and want to build the image locally instead of pulling it:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# It adds a `build:` block to the `api` service. Build context is the repo root (two levels up)
# because the API references ~20 sibling projects and the root Directory.*.props.

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
