# =============================================================================
#  Grafana DATA SOURCES — auto-added at startup (Docker variant)
# =============================================================================
# "Provisioning" means Grafana reads this file on boot and sets itself up — so the
# three data sources appear with zero manual clicking. A data source just tells
# Grafana WHERE to query each signal.
#
# Difference from the native-Windows version: the URLs use the compose SERVICE
# NAMES (http://prometheus:9090, etc.) because Grafana reaches the other containers
# over the shared Docker network, not via localhost.
#
# docker-compose.yml mounts this whole provisioning/ folder into Grafana read-only.

apiVersion: 1

datasources:
  # ── METRICS ──────────────────────────────────────────────────────────────
  - name: Prometheus          # the label you see in Grafana's data-source picker
    uid: prometheus           # stable id the dashboard JSON refers to — don't rename
    type: prometheus
    access: proxy             # Grafana's backend makes the query (not your browser)
    url: http://prometheus:9090
    isDefault: true           # the pre-selected source in new panels/Explore

  # ── TRACES ───────────────────────────────────────────────────────────────
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # "Logs for this trace" button: jump from a trace straight into its Loki logs,
      # filtered by the trace id, within a +/-5min window around the span.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      # Lets Tempo draw the service graph using metrics from Prometheus.
      serviceMap:
        datasourceUid: prometheus

  # ── LOGS ─────────────────────────────────────────────────────────────────
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # The reverse link: turn a trace_id found in a log line into a clickable link
      # back into Tempo (the trace waterfall). This is what wires logs → traces.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
