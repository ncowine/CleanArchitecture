# Grafana data source provisioning — points Grafana at the three stores and wires
# trace<->log correlation so you can jump between signals.
#
# NATIVE Grafana on Windows: copy this file into Grafana's provisioning folder, e.g.
#   C:\Program Files\GrafanaLabs\grafana\conf\provisioning\datasources\datasources.yaml
# then restart the Grafana service. (Or add the three sources by hand in the UI — the
# url values below are all you need.)

apiVersion: 1

datasources:
  # METRICS — your existing Prometheus.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true

  # TRACES — Tempo query API. tracesToLogsV2 makes the "Logs for this trace" button
  # jump straight into Loki, filtered by the trace id.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      serviceMap:
        datasourceUid: prometheus

  # LOGS — Loki. The derived field turns a trace_id in a log line into a clickable
  # link back into Tempo.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
