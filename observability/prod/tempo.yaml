# Tempo — traces store (production). Same as dev plus retention.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        # The OTLP/HTTP receiver on 4318 is deliberately absent: an unused
        # listener is only surface area. Add it back if something needs it.

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Without this, trace blocks accumulate until the volume is full and Tempo — then
# usually the whole host — stops. 720h = 30 days.
# Check real growth after a week:  docker system df -v | grep tempo-data
compactor:
  compaction:
    block_retention: 720h

usage_report:
  reporting_enabled: false
