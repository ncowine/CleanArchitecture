# =============================================================================
#  DEVELOPMENT stack — Tempo, Loki, Prometheus, Grafana (+ optional ELK)
# =============================================================================
# The API is NOT in here. You run it on your machine (Visual Studio or
# `dotnet run`), exactly like production runs it on IIS — Docker only ever hosts
# the telemetry stores.
#
#   docker compose up -d                     stores + Grafana
#   docker compose --profile elk up -d       ... plus Elasticsearch + Kibana
#   docker compose down                      stop   (add -v to wipe the data)
#
# Ports are published on ${BIND_ADDR} (127.0.0.1 by default), so nothing here is
# reachable from the rest of the network. Setup and URLs: ../README.md
# =============================================================================

name: cleanarch-dev

services:

  # TRACES. The app pushes spans to :4317 (OTLP/gRPC); Grafana reads :3200.
  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${BIND_ADDR}:3200:3200"   # query API (Grafana)
      - "${BIND_ADDR}:4317:4317"   # OTLP/gRPC ingest (the app)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # LOGS. One port does both: the app posts to /otlp/v1/logs, Grafana reads back.
  loki:
    image: grafana/loki:${LOKI_VERSION}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${BIND_ADDR}:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # METRICS. Prometheus PULLS: it scrapes the API on your host every 15s.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"          # POST /-/reload after editing the config
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDR}:9090:9090"
    # prometheus.yml scrapes the name "api-host"; host-gateway points it at your
    # machine (works on Docker Desktop and native Linux alike).
    extra_hosts:
      - "api-host:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q Ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # DASHBOARDS. Stores nothing — queries the three above. Anonymous admin: dev only.
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Links in alert notifications are absolute, so Grafana has to be told its
      # own address; without this they point at localhost:3000 inside the container.
      GF_SERVER_ROOT_URL: "http://${BIND_ADDR}:3000"
      # ── Alert email ──────────────────────────────────────────────────────────
      # Off unless SMTP_ENABLED=true in .env, so an unconfigured stack still starts.
      # See .env.example for what each of these wants; the email contact point that
      # consumes them is at the bottom of ../grafana/provisioning/alerting/.
      GF_SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${SMTP_HOST:-}"
      GF_SMTP_USER: "${SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      GF_SMTP_FROM_NAME: "${SMTP_FROM_NAME:-CleanArch Dev}"
      GF_SMTP_STARTTLS_POLICY: "${SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}"
      GF_SMTP_SKIP_VERIFY: "${SMTP_SKIP_VERIFY:-false}"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboard-cleanarch-api.json:/var/lib/grafana/dashboards/cleanarch-api.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDR}:3000:3000"
    # service_healthy, not the bare list form. Plain `depends_on` waits only for the
    # container to be CREATED, so Grafana used to start evaluating alert rules while
    # Prometheus was still booting, fail to query it, and report the API as down on
    # every single `up -d`. Waiting for the health check removes that false alarm.
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ── Audit trail (optional) ─────────────────────────────────────────────────
  # Behind the "elk" profile because Elasticsearch is heavy. Without it the audit
  # records still work — they go to the normal logs, and so reach Loki.
  # Security is OFF here: plain http, no credentials. Dev only.

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    profiles: ["elk"]
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP} -Xmx${ES_HEAP}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "${BIND_ADDR}:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s          # ES is slow to boot
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "${BIND_ADDR}:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  es-data:
